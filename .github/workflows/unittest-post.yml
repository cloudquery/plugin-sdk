name: Post Unit Tests

on:
  workflow_run:
    workflows: [Unit tests]
    types:
      - completed

permissions:
  contents: write
  actions: read
  pull-requests: write
  statuses: write

jobs:
  post-unitests:
    if: github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # This posts the status to the PR/commit
      - uses: haya14busa/action-workflow_run-status@967ed83efa565c257675ed70cfe5231f062ddd94 # v1
      - name: Download benchmarks
        uses: dawidd6/action-download-artifact@d63b86af1b34672e53c440b1b83979861906bad7 # v24
        with:
          # This is the run that triggered this workflow
          run_id: ${{ github.event.workflow_run.id }}
          name: delta-action-benchmarks
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Get PR number
        if: github.event.workflow_run.event == 'pull_request'
        id: pr_number
        run: echo "pr_number=$(cat pr_number)" >> $GITHUB_OUTPUT
      - name: Post deltas to GitHub
        uses: netlify/delta-action@1195810c67610e177b2f60da3f4cf6f620bd5d54 # v4
        with:
          title: "⏱️ Benchmark results"
          style: "text"
          pr_number: ${{ steps.pr_number.outputs.pr_number }}
